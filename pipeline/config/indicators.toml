[same_residence_5y_share]
name = "5年前と同じ場所に住む人の割合"
category = "暮らし方"
unit = "%"
kind = "ratio"
definition_version = "1"
digits = 1
scale = 100
min_denominator = 50
levels = ["municipality", "small_area"]
description = "その地域に住む人のうち、5年前（2015年10月）も今と同じ住所に住んでいた人の割合。低いほど人の入れ替わりが多い地域。"
method = "5年前の常住地が「現住所」の人 ÷（現住所 ＋ 移動あり ＋ 5年前の常住市区町村「不詳」）× 100。国勢調査 小地域集計 第19表。"
caveats = ["2020年の国勢調査の値です。", "移動状況が「不詳」の人は分母から除いています。都心部などでは不詳が多く、残りの人で計算しています。", "5年前にまだ生まれていなかった子どもの扱いは国勢調査の定義によります。", "分母が50人未満の地域は値を表示しません。"]
table = "residence_5y"
numerator_column = ["現住所"]
denominator_sum_columns = [["現住所"], ["移動あり（5年前の常住市区町村「不詳」を除く）"], ["5年前の常住市区町村「不詳」"]]
fraction_units = ["人", "人"]
legend = { method = "nice", classes = 12, scheme = "greens" }

