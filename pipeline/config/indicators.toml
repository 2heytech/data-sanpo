table = "residence_period"
denominator_sum_columns = [["総数", "総数（居住期間）"]]
denominator_subtract_columns = [["居住期間「不詳」"]]
fraction_units = ["人", "人"]
family = "residence_period"
numerator_column = ["1年未満"]
facets = { type = "1年未満", basis = "割合" }
legend = { method = "nice", classes = 12, scheme = "oranges" }

