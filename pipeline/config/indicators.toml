# 指標カタログ（設計書 第8章「指標カタログ」）。公開用 indicators.json の元になる。
# table: censuses.toml の各時点で使う表（population・age・education・household_size など）
# source_kind: 国勢調査以外の出典（sources.toml の kind）から取り込む指標。column はその表の列名
# numerator_indicator / denominator_indicator: 別の指標どうしの比（kind = ratio）。分母は denominator_period の値
# kind: count（人数・件数）/ ratio（分子÷分母×scale）/ density（分子÷面積km²）
#       / change（base の指標の前回の国勢調査からの増減率。(今回−前回)÷前回×scale）
# 分母が min_denominator 未満の率は値を出さず status=withheld とする（docs/design-changes.md #1）。
# legend: method = "nice"（切りのよい数値で12区分。偏った分布は分位点寄り）/ "diverging"（0を境に増減）。
#         zero_blank = true なら値が0の地域は色を塗らない（docs/design-changes.md #35）
# family / facets: 画面で1つの指標にまとめ、facets（種別 type・基準 basis）で切り替える（#36）
# traffic_filter: 交通事故（source_kind = npa_traffic）のうち数える事故（all / pedestrian / bicycle / fatal、#44）
# multi_year_total: 年計の直近 N 年分の合計を時点として足す（#36）
# sum_columns（count）: 複数の列の合計。denominator_subtract_columns（ratio）: 分母から引く列（不詳など、#43）
# denominator_period = "same": 分子と同じ時点の分母を使う。unbounded = true: 100%を超えてよい比（昼夜間人口比率、#42）
# allow_negative = true: 負の値がありうる額（製造業の付加価値額、#108）
# publish = false: 率の分母に使うだけで、画面・公開データには出さない指標（#101）
# municipal_table: 町丁・字等は table（小地域の表）から、市区町村・都道府県は人口等基本集計のこの表からも取る（#102）

[population_total]
name = "人口"
category = "人口・世帯"
unit = "人"
kind = "count"
definition_version = "1"
digits = 0
levels = ["municipality", "small_area"]
description = "常住人口（ふだん住んでいる人の数）。国勢調査の人口総数。"
method = "国勢調査 小地域集計の「人口総数」をそのまま掲載。市区町村の値は同調査の市区町村別の公表値。"
caveats = ["昼間に働く・通学する人の数ではありません。", "秘匿処理された町丁・字等は値なしとして表示し、合算先の地域に含まれます。", "2025年は国勢調査の人口等基本集計（2026年9月公表）の値で、市区町村の値だけです（町丁・字等の値は未公表）。"]
table = "population"
column = ["人口総数", "総数"]
legend = { method = "nice", classes = 12, scheme = "blues" }

[households_total]
name = "世帯数"
category = "人口・世帯"
unit = "世帯"
kind = "count"
definition_version = "1"
digits = 0
levels = ["municipality", "small_area"]
description = "一般世帯と施設等の世帯を合わせた世帯の数。"
method = "国勢調査 小地域集計の「世帯総数」をそのまま掲載。"
caveats = ["寮・病院などの施設等の世帯を含みます。", "2025年は国勢調査の人口等基本集計（2026年9月公表）の値で、市区町村の値だけです（町丁・字等の値は未公表）。"]
table = "population"
column = ["世帯総数"]
legend = { method = "nice", classes = 12, scheme = "blues" }

[persons_per_household]
name = "1世帯あたり人数"
category = "人口・世帯"
unit = "人"
kind = "ratio"
definition_version = "1"
digits = 2
scale = 1
min_denominator = 10
levels = ["municipality", "small_area"]
description = "1世帯あたりの平均の人数。単身世帯が多い地域ほど小さく、家族世帯が多い地域ほど大きくなる。"
method = "国勢調査の人口総数 ÷ 世帯総数。"
caveats = ["寮・病院・社会施設などの施設等の世帯とその人数を含みます。国勢調査が公表する「一般世帯の1世帯当たり人員」とは一致しないことがあります。", "世帯数が10未満の地域は値を表示しません。", "2025年は国勢調査の人口等基本集計（2026年9月公表）の値で、市区町村の値だけです（町丁・字等の値は未公表）。"]
table = "population"
numerator_column = ["人口総数", "総数"]
denominator_sum_columns = [["世帯総数"]]
fraction_units = ["人", "世帯"]
legend = { method = "nice", classes = 12, scheme = "bugn" }

[population_density]
name = "人口密度"
category = "人口・世帯"
unit = "人/km²"
kind = "density"
definition_version = "1"
digits = 0
levels = ["municipality", "small_area"]
description = "1km²あたりの常住人口。"
method = "人口 ÷ 境界データの面積（km²）。面積は簡略化前の境界の公表面積を使い、市区町村は町丁・字等の面積の合計（水面調査区を除く）。"
caveats = ["公園・河川・工場などの非居住地を含む面積で割っています。", "市区町村の面積は国土地理院の公表面積と一致しないことがあります。", "2025年は国勢調査の人口等基本集計（2026年9月公表）の値で、市区町村の値だけです（町丁・字等の値は未公表）。"]
numerator = "population_total"
legend = { method = "nice", classes = 12, scheme = "purples" }

[population_change_rate]
name = "人口増加率"
category = "人口・世帯"
unit = "%"
kind = "change"
definition_version = "1"
digits = 1
scale = 100
min_denominator = 50
levels = ["municipality", "small_area"]
description = "前回の国勢調査（5年前）から人口が何%増えたか。マイナスは減少。"
method = "（今回の人口 − 前回の人口）÷ 前回の人口 × 100。人口は国勢調査の人口総数。"
caveats = ["最も古い時点（2010年）は前回の値がないため表示しません。", "前回の人口が50人未満の地域は値を表示しません。", "町丁・字等は、両方の時点で2020年と境界がほぼ同じ地域だけ表示します。", "秘匿処理の合算の扱いが両時点で異なる地域は表示しません。", "2025年は国勢調査の人口等基本集計（2026年9月公表）の値で、市区町村の値だけです（町丁・字等の値は未公表）。"]
base = "population_total"
legend = { method = "diverging", classes = 12, scheme = "puor" }

[aged_65_plus_share]
name = "65歳以上の割合"
category = "年齢構成"
unit = "%"
kind = "ratio"
definition_version = "1"
digits = 1
scale = 100
min_denominator = 50
levels = ["municipality", "small_area"]
description = "年齢が判明している人口のうち、65歳以上の人の割合。"
method = "65歳以上人口 ÷ 年齢判明人口（15歳未満＋15〜64歳＋65歳以上）× 100。"
caveats = ["年齢不詳を分母から除いています。", "年齢判明人口が50人未満の地域は値を表示しません。", "2025年は国勢調査の人口等基本集計（2026年9月公表）の値で、市区町村の値だけです（町丁・字等の値は未公表）。"]
table = "age"
numerator_column = ["総数65歳以上", "65歳以上"]
denominator_sum_columns = [["総数15歳未満", "15歳未満"], ["総数15~64歳", "15~64歳"], ["総数65歳以上", "65歳以上"]]
legend = { method = "nice", classes = 12, scheme = "oranges" }

