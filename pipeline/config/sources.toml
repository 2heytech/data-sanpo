# している自治体の所管分は取り込まない（広告のあるサイトのため）。exclude_codes は市区町村コードの先頭、include_codes はその例外:
#   北海道（道の所管。HP掲載情報以外は商用不可）・札幌市（民間の保育施設は商用不可）→ 自ら所管する函館市・旭川市は含める
