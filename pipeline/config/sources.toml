# 出典の定義。版（ファイルhash）ごとに sources テーブルへ登録される。
# download_url は e-Stat 統計GIS の一括ダウンロードURL（2026-10-03 に GitHub Actions から
# 取得できることを確認）。統計表の statsId は集計単位ごとに異なる（T001081 は小地域、
# T001100 等は地域メッシュ）ので、変更時はファイルの KEY_CODE が11桁かを確認する。
# 取得できない場合は url の公開ページから手動でダウンロードして data/raw/<キー>/ に置く。
# per_prefecture = true の出典は都道府県ごとに取得し、download_url の {pref} を都道府県コード2桁に置き換えて
# data/raw/<キー>/<都道府県コード>/ に置く。prefectures を書いた出典はその都道府県だけ取得する（design-changes #52）。

[census2020_small_area_boundary]
per_prefecture = true
title = "令和2年国勢調査 小地域（町丁・字等）境界データ（世界測地系緯度経度・Shapefile）"
provider = "総務省統計局"
url = "https://www.e-stat.go.jp/gis/statmap-search?page=1&type=2&aggregateUnitForBoundary=A&toukeiCode=00200521&toukeiYear=2020&serveyId=A002005212020&coordsys=1&format=shape&datum=2011"
download_url = "https://www.e-stat.go.jp/gis/statmap-search/data?dlserveyId=A002005212020&code={pref}&coordSys=1&format=shape&downloadType=5&datum=2011"
files = ["*.shp", "*.dbf", "*.shx", "*.prj"]
encoding = "cp932"
license = "政府標準利用規約（第2.0版）"
license_url = "https://www.e-stat.go.jp/terms-of-use"
attribution = "出典：政府統計の総合窓口(e-Stat)（https://www.e-stat.go.jp/） 国勢調査 小地域境界データ"
modification_note = "境界を表示用に簡略化し、市区町村界を合成して作成"
redistributable = true

