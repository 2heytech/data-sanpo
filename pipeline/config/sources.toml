# 最終学歴は統計GISに町丁・字等の表がないため、e-Stat「ファイル」の小地域集計CSV（第13表）を使う。
# format = "estat_files" で統計GISの表と同じ形に読み替える（docs/design-changes.md #27-2）。
# statInfId は 2026-10-03 に GitHub Actions から取得して列名・秘匿処理の表記を確認した。
[census2020_small_area_education]
per_prefecture = true
# statInfId は都道府県ごとに違うので、取得時に e-Stat の一覧から表番号で探す（東京都は確認済みの値）
estat_lookup = { tstat = "000001136464", tclass1 = "000001136472", table = "第13表" }
known_ids = { "13" = "000032210414" }
title = "令和2年国勢調査 小地域集計 第13表 男女，在学か否かの別・最終卒業学校の種類別人口（15歳以上）－町丁・字等"
provider = "総務省統計局"
url = "https://www.e-stat.go.jp/stat-search/files?tstat=000001136464&toukei=00200521&cycle=0&tclass1=000001136472&layout=datalist&page=1&tclass3val=0"
download_url = "https://www.e-stat.go.jp/stat-search/file-download?statInfId={id}&fileKind=1"
download_filename = "h13_{pref}.csv"
files = ["*.csv"]
format = "estat_files"
encoding = "cp932"
license = "政府標準利用規約（第2.0版）"
license_url = "https://www.e-stat.go.jp/terms-of-use"
attribution = "出典：政府統計の総合窓口(e-Stat)（https://www.e-stat.go.jp/） 令和2年国勢調査 小地域集計"
modification_note = "最終卒業学校の種類別人口から割合を算出して作成"
redistributable = true

