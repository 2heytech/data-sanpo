# 町丁・字等ごとの土地利用・標高（docs/design-changes.md #123）。元データが大きい（土地利用細分メッシュは4年度で約6GB）ため、
# Actions「Prepare derived sources」（python -m tdm prepare、作り方は config/prepare.toml）で町丁・字等（2020年国勢調査の
# 境界）ごとに集計したものを GitHub Release「derived-sources」に置き、ここではその集計を取得する。
# optional = true: まだ集計を置いていないとき（404）は、その出典を飛ばして公開版を作る。
# ファイル名の版（-v1 など）は、作り方や元データを変えたら上げる（Release の同じ名前のファイルは置き換えない）。
# gap_column: その年度のデータがない（都市地域では範囲外の）陸のマスの数の列。陸のマスとの合計の5%を超える地域は値なしにし、
# gap_note を注記する。
[land_use_towns]
kind = "land_use_cells"
title = "国土数値情報 土地利用細分メッシュ（昭和51・平成3・平成18・令和3年度）"
provider = "国土交通省"
url = "https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-L03-b-2021.html"
download_url = "https://github.com/2heytech/data-sanpo/releases/download/derived-sources/land_use_towns-v1.csv.gz"
optional = true
files = ["land_use_towns-v1.csv.gz"]   # download_url のファイル名と同じにする（古い版が残っていても使わない）
gap_column = "データなし"
gap_note = "この年度のデータがない範囲を含むため値なし"
license = "クリエイティブ・コモンズ 表示 4.0 国際（国土数値情報 オープンデータ）"
license_url = "https://nlftp.mlit.go.jp/ksj/other/agreement.html"
attribution = "出典：国土交通省 国土数値情報（土地利用細分メッシュデータ）"
modification_note = "100mのマスを、中心が入る町丁・字等ごとに区分別に数えて作成。区分は年度をまたいで共通の区分にまとめた"
