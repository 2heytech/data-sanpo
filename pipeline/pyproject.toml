[project]
name = "tdm"
version = "0.1.0"
description = "データさんぽ: 公開データの取得・加工・公開ファイル生成"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0", "pyshp>=2.3", "xlrd>=2.0"]

[project.optional-dependencies]
# prepare: Actions「Prepare derived sources」の集計（tdm/prepare、#123）。dev はそのテストのため Pillow を含む
dev = ["pytest>=8", "pillow>=10"]
prepare = ["numpy>=1.24", "pillow>=10"]

[project.scripts]
tdm = "tdm.cli:main"

[tool.setuptools]
packages = ["tdm", "tdm.ingest", "tdm.prepare"]

[tool.setuptools.package-data]
tdm = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
