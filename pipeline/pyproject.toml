[project]
name = "tdm"
version = "0.1.0"
description = "全国データさんぽ: 公開データの取得・加工・公開ファイル生成"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0", "pyshp>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tdm = "tdm.cli:main"

[tool.setuptools]
packages = ["tdm", "tdm.ingest"]

[tool.setuptools.package-data]
tdm = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
