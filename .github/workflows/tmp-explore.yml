name: tmp explore (一時的・PR前に消す)
on:
  push:
    branches: [claude/project-thread-rskee0]
    paths: [.github/workflows/tmp-explore.yml]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q -e pipeline
      - run: (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils poppler-data) >/dev/null 2>&1
      - name: show missing rows
        working-directory: pipeline
        run: |
          python - <<'PY'
          import tomllib, urllib.request, re
          from pathlib import Path
          from tdm.ingest.mext_school_aid import pdf_text, read_rates
          src = tomllib.loads(Path("config/sources.toml").read_text(encoding="utf-8"))
          from tdm.ingest.mext_school_aid import _norm, _match
          from tdm.regions import PREFECTURES
          ents = {}
          for line in Path("tmp_munis.tsv").read_text(encoding="utf-8").splitlines():
              eid, name = line.split("\t")
              ents[(PREFECTURES[eid[5:7]], _norm(name))] = eid
          for key in ("mext_school_aid_2024", "mext_school_aid_2023", "mext_school_aid_2022", "mext_school_aid_2021"):
              cfg = src[key]; got = set(); unmatched = []; bad = []
              for n in range(1, 48):
                  pref = f"{n:02d}"
                  url = cfg["download_url"].replace("{pref_n}", str(n)).replace("{pref3}", pref.zfill(3))
                  p = Path(f"/tmp/{key}_{pref}.pdf"); p.write_bytes(urllib.request.urlopen(url, timeout=60).read())
                  year, rates = read_rates(pdf_text(p))
                  if year != cfg["fiscal_year"]: bad.append(f"{pref}:{year}")
                  for (pn, m), v in rates.items():
                      e = _match(ents, pn, m)
                      if e: got.add(e)
                      else: unmatched.append(f"{pn}{m}")
              miss = sorted(eid for eid in ents.values() if eid not in got)
              names = {v: k[1] for k, v in ents.items()}
              print("=====", key, "matched", len(got), "bad", bad)
              print("  unmatched", unmatched)
              print("  no value (wards excluded?)", [f"{e}{names[e]}" for e in miss if "区" not in names[e]])
          PY
