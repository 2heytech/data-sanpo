name: tmp explore (一時的・PR前に消す)
on:
  push:
    branches: [claude/project-thread-rskee0]
    paths: [.github/workflows/tmp-explore.yml]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e pipeline
      - run: (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils poppler-data) >/dev/null 2>&1
      - name: parse all prefectures
        working-directory: pipeline
        run: |
          python - <<'PY'
          import tomllib, urllib.request, collections
          from pathlib import Path
          from tdm.ingest.mext_school_aid import pdf_text, read_rates
          src = tomllib.loads(Path("config/sources.toml").read_text(encoding="utf-8"))
          for key in ("mext_school_aid_2024", "mext_school_aid_2023", "mext_school_aid_2022", "mext_school_aid_2021"):
              cfg = src[key]
              tot = collections.Counter(); bad = []
              for n in range(1, 48):
                  pref = f"{n:02d}"
                  url = cfg["download_url"].replace("{pref_n}", str(n)).replace("{pref3}", pref.zfill(3))
                  path = Path(f"/tmp/{key}_{pref}.pdf")
                  try:
                      path.write_bytes(urllib.request.urlopen(url, timeout=60).read())
                      year, rates = read_rates(pdf_text(path))
                  except Exception as e:
                      bad.append(f"{pref}:ERR {e}"); continue
                  none = [m for (p, m), v in rates.items() if v is None]
                  tot["rows"] += len(rates); tot["none"] += len(none)
                  for v in rates.values(): tot[v] += 1
                  if year != cfg["fiscal_year"] or none or len(rates) < 5:
                      bad.append(f"{pref}: year={year} rows={len(rates)} none={none[:8]}")
              print("=====", key, dict(tot))
              for b in bad: print("  ", b)
          PY
