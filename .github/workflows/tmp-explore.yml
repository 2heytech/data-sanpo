name: tmp explore (一時的・PR前に消す)
on:
  push:
    branches: [claude/project-thread-rskee0]
    paths: [.github/workflows/tmp-explore.yml]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e pipeline
      - run: (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils poppler-data) >/dev/null 2>&1
      - name: J51 headers
        continue-on-error: true
        run: |
          for f in J51-25-a J51-25-b; do
            curl -sSL -o $f.xlsx https://www.soumu.go.jp/main_sosiki/jichi_zeisei/czaisei/czaisei_seido/xls/$f.xlsx
            python -c "
          from tdm.xlsx import read_sheet; from pathlib import Path
          rows = read_sheet(Path('$f.xlsx'))
          print('ROWS', len(rows))
          for r in rows[:9]: print('|'.join('' if c is None else str(c) for c in r)[:1500])
          "
          done
      - name: shuugaku PDFs
        continue-on-error: true
        run: |
          curl -sSL -o s13.pdf https://www.mext.go.jp/content/20260708-mxt_shuugaku-000050859_13.pdf
          pages=$(pdfinfo s13.pdf | awk '/^Pages/{print $2}'); echo "PAGES $pages"
          for p in $(seq 1 $pages); do
            t=$(pdftotext -layout -f $p -l $p s13.pdf - | head -c 400 | tr -s ' \n' ' ')
            echo "PAGE $p: ${t:0:200}"
          done
          for p in $(seq 1 $pages); do
            if pdftotext -f $p -l $p s13.pdf - | grep -q "援助率"; then
              echo "======== PAGE $p (援助率)"; pdftotext -layout -f $p -l $p s13.pdf - | sed 's/  \+/ | /g' | head -120
            fi
          done
