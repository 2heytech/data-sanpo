name: tmp explore (一時的・PR前に消す)
on:
  push:
    branches: [claude/project-thread-rskee0]
    paths: [.github/workflows/tmp-explore.yml]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e pipeline
      - run: (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils poppler-data) >/dev/null 2>&1 || true; pdftotext -v || true; pip install -q pdfminer.six
      - name: J51 headers
        run: |
          for f in J51-25-a J51-25-b; do
            curl -sSL -o $f.xlsx https://www.soumu.go.jp/main_sosiki/jichi_zeisei/czaisei/czaisei_seido/xls/$f.xlsx
            python -c "
          from tdm.xlsx import read_sheet; from pathlib import Path
          rows = read_sheet(Path('$f.xlsx'))
          for r in rows[:12]: print(r)
          print(len(rows))
          "
          done
      - name: shuugaku PDFs
        continue-on-error: true
        run: |
          for n in 5 13; do
            curl -sSL -o s$n.pdf https://www.mext.go.jp/content/20260708-mxt_shuugaku-000050859_$n.pdf
            pdfinfo s$n.pdf | head -20
            pdftotext -layout s$n.pdf s$n.txt
            echo "===== layout $n"; head -c 12000 s$n.txt
            echo "===== pdfminer $n"; pdf2txt.py -t text s$n.pdf | head -c 6000
          done
