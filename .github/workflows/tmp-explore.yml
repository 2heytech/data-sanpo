name: tmp explore (一時的・PR前に消す)
on:
  push:
    branches: [claude/project-thread-rskee0]
    paths: [.github/workflows/tmp-explore.yml]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q -e pipeline
      - run: (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils poppler-data) >/dev/null 2>&1
      - name: show missing rows
        working-directory: pipeline
        run: |
          python - <<'PY'
          import tomllib, urllib.request, re
          from pathlib import Path
          from tdm.ingest.mext_school_aid import pdf_text, read_rates
          src = tomllib.loads(Path("config/sources.toml").read_text(encoding="utf-8"))
          want = {
            "mext_school_aid_2024": {"21": ["多治見","中津川","美濃加茂","各務原","関ケ原"], "26": ["相楽","広域","連合","組合"], "27": ["豊中"]},
            "mext_school_aid_2023": {"08": ["かすみがうら","つくばみらい"], "42": ["早"], "46": ["串木野"], "27": ["豊中"]},
          }
          for key, prefs in want.items():
              cfg = src[key]
              for pref, names in prefs.items():
                  url = cfg["download_url"].replace("{pref_n}", str(int(pref))).replace("{pref3}", pref.zfill(3))
                  p = Path(f"/tmp/{key}_{pref}.pdf"); p.write_bytes(urllib.request.urlopen(url, timeout=60).read())
                  text = pdf_text(p)
                  print("=====", key, pref)
                  for page in text.split("\f"):
                      if "援助率" not in page: continue
                      lines = page.splitlines()
                      for i, line in enumerate(lines):
                          if any(n in line for n in names):
                              for l in lines[max(0, i-2): i+3]: print("   |", l[:60], "...", l[-30:])
                              print("   ---")
          PY
