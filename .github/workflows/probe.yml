name: probe
on:
  push:
    branches: [claude/probe-map-vendor]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.49.1 && python -m playwright install --with-deps chromium > /dev/null
      - run: python3 probe/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: /tmp/shots
          retention-days: 1
