name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pipeline
        run: python -m pip install -e "pipeline[dev]"
      - name: Test pipeline
        working-directory: pipeline
        run: python -m pytest -q
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Build fixture data
        working-directory: web
        run: npm run fixture
      - name: Type check
        working-directory: web
        run: npm run check
      - name: Test web
        working-directory: web
        run: npm test
      - name: Build site
        working-directory: web
        run: npm run build
