# 一時: 気象庁の平年値ファイルの形を確かめる（PR 前に消す）
name: Probe JMA
on:
  push:
    branches: [claude/project-thread-ltpjll]
    paths: [".github/workflows/probe-jma.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.data.jma.go.jp/stats/data/mdrr/normal/2020/data
          for f in normal_amedas_monthly amedas_station_index; do
            curl -sSfL -A "Mozilla/5.0" -o $f.zip $B/$f.zip; mkdir -p $f; (cd $f && unzip -q -o ../$f.zip); done
          sha256sum *.zip; unzip -l amedas_station_index.zip
          find normal_amedas_monthly -type f | wc -l
          find normal_amedas_monthly -type f | head -3
          S=$(find amedas_station_index -type f -name '*.csv' | head -1); echo "== $S"; wc -l "$S"
          iconv -f cp932 -t utf-8 "$S" | head -5; iconv -f cp932 -t utf-8 "$S" | grep -E "^ ?(44132|14163|91197|11001|48156|54232)" 
          iconv -f cp932 -t utf-8 "$S" | tail -3
          echo "== tokyo"; cat $(find normal_amedas_monthly -name 'nml_amd_m_44132.csv') | grep -E ",(3500|4000|6200|6300|5100)," 
          echo "== sapporo"; cat $(find normal_amedas_monthly -name 'nml_amd_m_14163.csv') | grep -E ",(3500|4000|6200|6300)," 
          echo "== naha"; cat $(find normal_amedas_monthly -name 'nml_amd_m_91197.csv') | grep -E ",(3500|4000|6200|6300)," 
          for e in 3500 4000 6200 6300; do echo "$e valid: $(cat $(find normal_amedas_monthly -type f) | grep -E "^21,[0-9]{5},$e," | awk -F, '$NF!="" {print substr($0,length($0),1)}' | sort | uniq -c | tr '\n' ' ')"; done
          echo "years distribution 4000:"; cat $(find normal_amedas_monthly -type f) | grep -E "^21,[0-9]{5},4000," | cut -d, -f4 | sort | uniq -c | sort -rn | head -12
          echo "years distribution 3500:"; cat $(find normal_amedas_monthly -type f) | grep -E "^21,[0-9]{5},3500," | cut -d, -f4 | sort | uniq -c | sort -rn | head -12
          echo "years distribution 6200:"; cat $(find normal_amedas_monthly -type f) | grep -E "^21,[0-9]{5},6200," | cut -d, -f4 | sort | uniq -c | sort -rn | head -12
          echo "elements:"; cat $(find normal_amedas_monthly -type f) | cut -d, -f3 | sort | uniq -c | tr '\n' ' '
          echo; echo "6200 annual RMK8 value 0 count:"; cat $(find normal_amedas_monthly -type f) | grep -E "^21,[0-9]{5},6200," | awk '{print substr($0,length($0)-7)}' | sort | uniq -c | sort -rn | head -5
