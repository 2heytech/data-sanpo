# 一時的な確認用（PR に入れる前に消す）
name: Probe industry sources
on:
  push:
    branches: [claude/project-thread-hf6wem]
    paths: [".github/probe/**", ".github/workflows/probe-industry.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl
      - run: python .github/probe/probe.py
